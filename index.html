<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inventory QR Stockchecker v0.2.3(cherry)</title>
    <link rel="manifest" href="manifest.json?v=0.2.3">
    
    <!-- BeerCSS & Google Material Icons -->
    <link href="https://cdn.jsdelivr.net/npm/beercss@3.7.12/dist/cdn/beer.min.css" rel="stylesheet">
    <script type="module" src="https://cdn.jsdelivr.net/npm/beercss@3.7.12/dist/cdn/beer.min.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/material-dynamic-colors@1.1.2/dist/cdn/material-dynamic-colors.min.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">

    <!-- html5-qrcode & QRCode.js -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            font-size: 28px !important; 
        }

        body { 
            margin: 0; 
            height: 100vh; 
            overflow: hidden; 
            background-color: #0f172a; 
            color: #ffffff;
            font-family: sans-serif;
        }
        
        /* 見切れ防止のため上下にスクロール余裕と十分なパディングを持たせる */
        .fullscreen-flex {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2.5rem 1.5rem;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .action-container {
            width: 100%;
            max-width: 550px;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }
        
        .atm-btn {
            width: 100%;
            min-height: 90px !important;
            font-size: 1.7rem !important;
            border-radius: 24px !important;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            font-weight: 900 !important;
            cursor: pointer;
            border: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            transition: transform 0.1s ease;
        }
        .atm-btn:active { transform: scale(0.97); }

        .atm-primary { background-color: #2563eb !important; color: #ffffff !important; }
        .atm-warning { background-color: #d97706 !important; color: #ffffff !important; }
        .atm-neutral { background-color: #334155 !important; color: #cbd5e1 !important; border: 2px solid #475569 !important; }

        .app-icon { font-size: 5rem !important; color: #60a5fa; margin-bottom: 0.2rem; }
        .app-title { font-size: 2.8rem !important; font-weight: 900; margin-bottom: 0.1rem; text-align: center; }
        .app-version { font-size: 1.2rem !important; text-align: center; color: #94a3b8; font-weight: bold; margin-bottom: 1rem; }

        /* カメラ・スキャン周り */
        #reader { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; background: #000; }
        #reader video { object-fit: cover !important; width: 100% !important; height: 100% !important; }
        #reader__scan_region, #reader__dashboard_section { display: none !important; }
        
        .overlay-ui { position: fixed; z-index: 10; }
        
        /* ★修正: ステータスバーやノッチとの被りを防ぐため、上部に十分なマージンを確保 */
        .top-nav { top: env(safe-area-inset-top, 1.5rem); top: calc(1.5rem + env(safe-area-inset-top, 0px)); left: 1.5rem; right: 1.5rem; display: flex; justify-content: space-between; pointer-events: none; }
        .top-nav button { pointer-events: auto; width: 76px; height: 76px; border-radius: 50%; background: rgba(0,0,0,0.7); color: white; border: none; }
        
        .bottom-toast { 
            bottom: calc(3rem + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); 
            width: 90%; max-width: 450px; 
            background: rgba(15, 23, 42, 0.9); color: white; 
            padding: 1.5rem; border-radius: 24px; 
            font-size: 1.5rem; font-weight: 900; text-align: center; 
            backdrop-filter: blur(12px);
            border: 3px solid #3b82f6;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- ========================================== -->
    <!-- PCアクセス時の案内画面 -->
    <!-- ========================================== -->
    <main id="pc-guide-screen" class="fullscreen-flex hidden">
        <i class="material-symbols-outlined app-icon">inventory_2</i>
        <div class="app-title">QR Stock</div>
        <div class="app-version">v0.2.3(cherry)</div>
        <div style="background:white; padding:1.5rem; border-radius:1.5rem; margin-bottom: 1.5rem;">
            <div id="qrcode"></div>
        </div>
        <div class="action-container">
            <button class="atm-btn atm-neutral" onclick="startPcCameraMode()">PCカメラでテスト起動</button>
        </div>
    </main>

    <!-- ========================================== -->
    <!-- Scene 0：スタート・最新版確認画面 (v0.2.3) -->
    <!-- ========================================== -->
    <main id="start-screen" class="fullscreen-flex">
        <i class="material-symbols-outlined app-icon">inventory_2</i>
        <div class="app-title">QR Stock</div>
        <div class="app-version">v0.2.3(cherry)</div>
        <div id="update-status" style="font-size: 1.2rem; color: #60a5fa; font-weight: bold; min-height: 1.8rem; margin-bottom: 0.8rem; text-align: center;"></div>

        <div class="action-container">
            <button class="atm-btn atm-primary" onclick="startApp()">
                <i class="material-symbols-outlined" style="font-size: 2.3rem;">qr_code_scanner</i>
                <span>開始する</span>
            </button>
            <button class="atm-btn atm-warning" onclick="checkLatestVersion()">
                <i class="material-symbols-outlined" style="font-size: 2.3rem;">update</i>
                <span>最新版の確認</span>
            </button>
            <button class="atm-btn atm-neutral" onclick="closeApp()">
                <span>アプリを終了する</span>
            </button>
        </div>
    </main>

    <!-- ========================================== -->
    <!-- Scene 1：スキャン画面 -->
    <!-- ========================================== -->
    <div id="scanner-container" class="hidden">
        <div class="overlay-ui top-nav">
            <button onclick="returnToStartScreen()">
                <i class="material-symbols-outlined" style="font-size: 2.8rem;">close</i>
            </button>
        </div>

        <div id="reader"></div>

        <div class="overlay-ui bottom-toast">
            QRコードを画面に写してください
        </div>
    </div>

    <!-- ========================================== -->
    <!-- Scene 2：ボトムシート (結果確認モーダル) -->
    <!-- ========================================== -->
    <dialog class="bottom" id="bottom-sheet" style="border-top-left-radius: 40px; border-top-right-radius: 40px; padding: 2.5rem; background: #1e293b; color: #fff;">
        <h5 id="modal-title" style="font-size: 2.2rem; font-weight: 900; margin-bottom: 0.4rem;">Google Drive検索</h5>
        <p id="modal-desc" style="font-size: 1.3rem; color: #94a3b8; margin-bottom: 1.5rem;">一致するファイルを検索します</p>
        
        <div style="background: #0f172a; padding: 1.5rem; border-radius: 24px; margin-bottom: 2rem; border: 2px solid #334155;">
            <label style="font-size: 1rem; color: #94a3b8; font-weight: bold; display: block; margin-bottom: 0.4rem;">スキャンデータ</label>
            <div id="modal-scanned-data" style="font-size: 1.6rem; font-weight: bold; word-break: break-all; color: #f8fafc;"></div>
        </div>

        <div class="action-container" style="max-width: none;">
            <a id="modal-primary-btn" class="atm-btn atm-primary" href="#" target="_blank" onclick="handleOpenLink()" style="text-decoration: none;">
                <i class="material-symbols-outlined" style="font-size: 2.3rem;">open_in_new</i>
                <span id="modal-primary-btn-text">開く</span>
            </a>
            <button class="atm-btn atm-neutral" onclick="closeBottomSheet()">
                キャンセル (再撮影)
            </button>
        </div>
    </dialog>

    <!-- Script Logic -->
    <script>
        let html5QrCode = null;
        let isScanned = false;

        ui('theme', '#2563eb');

        function startApp() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('scanner-container').classList.remove('hidden');
            startCamera({ facingMode: "environment" });
        }

        function returnToStartScreen() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => { html5QrCode = null; }).catch(err => console.error(err));
            }
            document.getElementById('scanner-container').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        }

        function checkLatestVersion() {
            const status = document.getElementById('update-status');
            status.innerText = "最新バージョン(cherry)を確認中...";
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistration().then(registration => {
                    if (registration) {
                        registration.update().then(() => {
                            status.innerText = "最新の状態に更新されました！再読み込みします。";
                            setTimeout(() => { window.location.reload(true); }, 800);
                        });
                    } else {
                        window.location.reload(true);
                    }
                }).catch(() => { window.location.reload(true); });
            } else {
                window.location.reload(true);
            }
        }

        function closeApp() {
            if (window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) {
                window.close();
            } else {
                alert("ブラウザのタブまたはアプリを閉じてください。");
            }
        }

        function initApp() {
            const isDesktop = window.innerWidth > 1024 && !('ontouchstart' in window);
            if (isDesktop) {
                document.getElementById('pc-guide-screen').classList.remove('hidden');
                document.getElementById('start-screen').classList.add('hidden');
                
                const qrContainer = document.getElementById('qrcode');
                qrContainer.innerHTML = "";
                new QRCode(qrContainer, {
                    text: window.location.href,
                    width: 220,
                    height: 220,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
            }
        }

        function startPcCameraMode() {
            document.getElementById('pc-guide-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        }

        function startCamera(cameraConfig) {
            if (html5QrCode) return;
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                cameraConfig,
                { fps: 15 }, 
                onScanSuccess
            ).catch(err => { 
                console.error("Camera Error", err); 
                alert("カメラの起動に失敗しました。権限を確認してください。");
            });
        }

        window.addEventListener('load', initApp);

        function onScanSuccess(decodedText) {
            if (isScanned) return;
            isScanned = true;

            const title = document.getElementById('modal-title');
            const desc = document.getElementById('modal-desc');
            const scannedData = document.getElementById('modal-scanned-data');
            const primaryBtn = document.getElementById('modal-primary-btn');
            const primaryBtnText = document.getElementById('modal-primary-btn-text');

            scannedData.innerText = decodedText;

            if (decodedText.startsWith("https://") || decodedText.startsWith("http://")) {
                title.innerText = "⚠️ 外部Webサイト";
                title.style.color = "#f87171";
                desc.innerText = "安全性を確認の上アクセスしてください。";
                primaryBtnText.innerText = "サイトを開く";
                primaryBtn.href = decodedText;
                primaryBtn.className = "atm-btn atm-warning"; 
            } else {
                title.innerText = "Google Drive検索";
                title.style.color = "#ffffff";
                desc.innerText = "一致するファイルを検索します";
                primaryBtnText.innerText = "検索する";
                const encodedQuery = encodeURIComponent(decodedText);
                primaryBtn.href = `https://drive.google.com/drive/search?q=${encodedQuery}`;
                primaryBtn.className = "atm-btn atm-primary"; 
            }

            ui('#bottom-sheet');
            if (html5QrCode) html5QrCode.pause();
        }

        function handleOpenLink() {
            ui('#bottom-sheet');
            resetScanner();
        }

        function closeBottomSheet() {
            ui('#bottom-sheet');
            resetScanner();
        }

        function resetScanner() {
            isScanned = false;
            if (html5QrCode) html5QrCode.resume();
        }

        if ('serviceYear' in navigator || 'serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW reg fail', err));
        }
    </script>
</body>
</html>
