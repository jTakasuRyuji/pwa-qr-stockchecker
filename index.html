<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory QR Stockchecker</title>
    <link rel="manifest" href="manifest.json">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        twitter: '#1d9bf0',
                        twitterHover: '#1a8cd8',
                    }
                }
            }
        }
    </script>
    <!-- html5-qrcode ライブラリ -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        #reader {
            border: none !important;
            width: 100% !important;
            height: 100% !important;
        }
        #reader video {
            object-fit: cover !important;
            width: 100% !important;
            height: 100% !important;
        }
        #reader__scan_region {
            background: transparent !important;
        }
        #reader__dashboard_section {
            display: none !important;
        }
    </style>
</head>
<body class="bg-black text-gray-900 h-screen w-screen overflow-hidden flex flex-col font-sans">

    <!-- ========================================== -->
    <!-- PC用ガイド画面 -->
    <!-- ========================================== -->
    <div id="pc-guide-screen" class="hidden absolute inset-0 z-50 bg-gray-900 text-white flex flex-col items-center justify-center p-6 text-center overflow-y-auto">
        <div class="max-w-md w-full bg-gray-800 border border-gray-700 rounded-3xl p-8 shadow-2xl flex flex-col items-center gap-6 my-auto">
            <div class="text-4xl">📦</div>
            <div class="flex flex-col gap-2">
                <h1 class="text-2xl font-bold">Inventory QR Stockchecker</h1>
                <p class="text-base text-gray-300 leading-relaxed">
                    スマートフォンでの利用を想定したPWAアプリです。下のQRコードをスマホでスキャンしてください。
                </p>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-inner flex flex-col items-center gap-2">
                <div id="qrcode" class="flex justify-center"></div>
                <span class="text-xs text-gray-600 font-medium">スマホのカメラでスキャン</span>
            </div>
            <button onclick="startPcCameraMode()" class="w-full bg-gray-700 hover:bg-gray-600 text-white font-bold py-4 px-6 rounded-2xl transition text-base border border-gray-600">
                🖥️ 【実験的】PCカメラで試すモード
            </button>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- スキャン画面 -->
    <!-- ========================================== -->
    <div id="scanner-container" class="relative flex-1 w-full h-full bg-black flex flex-col">
        <header class="absolute top-0 left-0 right-0 z-30 p-4 bg-gradient-to-b from-black/80 to-transparent flex items-center justify-between text-white">
            <button onclick="location.reload()" class="bg-black/50 hover:bg-black/70 text-white font-bold p-3 rounded-full backdrop-blur-md transition flex items-center justify-center">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <div id="scanner-title" class="text-lg font-bold tracking-wider">スキャン</div>
            <button onclick="openSettings()" class="bg-black/50 hover:bg-black/70 text-white font-bold p-3 rounded-full backdrop-blur-md transition flex items-center justify-center">
                <span class="text-xl">⚙️</span>
            </button>
        </header>

        <div id="reader" class="absolute inset-0 w-full h-full"></div>

        <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none z-20">
            <div class="w-[75vw] h-[75vw] max-w-[300px] max-h-[300px] border-2 border-twitter rounded-2xl relative shadow-2xl bg-transparent">
                <div class="absolute w-6 h-6 border-t-4 border-l-4 border-twitter -top-1 -left-1"></div>
                <div class="absolute w-6 h-6 border-t-4 border-r-4 border-twitter -top-1 -right-1"></div>
                <div class="absolute w-6 h-6 border-b-4 border-l-8 border-twitter -bottom-1 -left-1"></div>
                <div class="absolute w-6 h-6 border-b-4 border-r-4 border-twitter -bottom-1 -right-1"></div>
            </div>
            <p id="ui-banner-text" class="text-white font-medium mt-6 text-base bg-black/60 px-6 py-2 rounded-full backdrop-blur-md tracking-wide">
                ピントを合わせてください[cite: 14]
            </p>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- HTTPS警告・確認モーダル (決済アプリ風UX) -->
    <!-- ========================================== -->
    <div id="confirm-modal" class="hidden absolute inset-0 z-[90] bg-black/70 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-6">
        <div class="bg-white rounded-t-3xl sm:rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-2xl flex flex-col gap-6 animate-slide-up">
            <div class="flex flex-col items-center text-center gap-3">
                <div class="w-16 h-16 rounded-full bg-blue-50 text-twitter flex items-center justify-center text-3xl shadow-inner">
                    🌐
                </div>
                <!-- 警告タイトル -->
                <h2 class="text-xl font-bold text-gray-900">外部のURLを表示します</h2>
                <p id="warning-message" class="text-sm text-gray-500">このURLは当システムで管理や保証をしていません。表示してよろしいですか？[cite: 13]</p>
            </div>

            <div class="bg-gray-50 p-4 rounded-2xl border border-gray-200">
                <span class="text-xs font-bold text-gray-400 uppercase tracking-wider block mb-1">読み取りデータ</span>
                <div id="scanned-id-display" class="font-mono text-xs text-gray-800 break-all font-bold"></div>
            </div>

            <div class="flex flex-col gap-3">
                <!-- 表示するボタン（青）[cite: 13] -->
                <a id="drive-link" href="#" target="_blank" onclick="handleDriveOpen()" class="w-full bg-twitter hover:bg-twitterHover text-white font-bold py-4 rounded-2xl text-center transition shadow-lg text-lg flex items-center justify-center gap-2">
                    <span>表示する[cite: 13]</span>
                </a>
                <!-- キャンセルボタン[cite: 13] -->
                <button onclick="closeConfirmModal()" class="w-full bg-white hover:bg-gray-100 text-gray-700 font-bold py-3.5 rounded-2xl text-center transition text-base border border-gray-200">
                    キャンセル[cite: 13]
                </button>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 設定モーダル -->
    <!-- ========================================== -->
    <div id="settings-modal" class="hidden absolute inset-0 z-[100] bg-black/70 backdrop-blur-sm flex items-center justify-center p-6">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl flex flex-col gap-6">
            <div class="flex items-center justify-between border-b pb-4">
                <h2 class="text-xl font-bold text-gray-900">⚙️ 表示設定</h2>
                <button onclick="closeSettings()" class="text-gray-500 hover:text-gray-700 text-2xl font-bold p-1">✕</button>
            </div>

            <div class="flex flex-col gap-3">
                <label class="text-base font-bold text-gray-700">文字サイズ選択</label>
                <div class="grid grid-cols-3 gap-3">
                    <button onclick="changeFontSize('normal')" id="btn-size-normal" class="py-3 px-4 rounded-xl border-2 font-bold text-base transition">標準</button>
                    <button onclick="changeFontSize('large')" id="btn-size-large" class="py-3 px-4 rounded-xl border-2 font-bold text-lg transition">大</button>
                    <button onclick="changeFontSize('xlarge')" id="btn-size-xlarge" class="py-3 px-4 rounded-xl border-2 font-bold text-xl transition">特大</button>
                </div>
            </div>

            <button onclick="closeSettings()" class="w-full bg-twitter text-white font-bold py-4 rounded-2xl shadow-lg text-lg">
                設定を保存して閉じる
            </button>
        </div>
    </div>

    <script>
        let html5QrCode = null;
        let isScanned = false;

        function applyFontSize(size) {
            localStorage.setItem('qr_stock_fontsize', size);
            const banner = document.getElementById('ui-banner-text');
            
            ['normal', 'large', 'xlarge'].forEach(s => {
                const btn = document.getElementById(`btn-size-${s}`);
                if (btn) {
                    if (s === size) {
                        btn.className = "py-3 px-4 rounded-xl border-2 border-twitter bg-blue-50 text-twitter font-bold transition text-lg";
                    } else {
                        btn.className = "py-3 px-4 rounded-xl border-2 border-gray-200 bg-gray-50 text-gray-700 font-bold transition text-base";
                    }
                }
            });

            if (banner) {
                if (size === 'normal') banner.className = "text-white font-medium mt-6 text-sm bg-black/60 px-6 py-2 rounded-full backdrop-blur-md tracking-wide";
                if (size === 'large') banner.className = "text-white font-medium mt-6 text-sm bg-black/60 px-6 py-2 rounded-full backdrop-blur-md tracking-wide text-lg";
                if (size === 'xlarge') banner.className = "text-white font-medium mt-6 text-sm bg-black/60 px-6 py-2 rounded-full backdrop-blur-md tracking-wide text-xl font-bold";
            }
        }

        function changeFontSize(size) {
            applyFontSize(size);
        }

        function openSettings() { document.getElementById('settings-modal').classList.remove('hidden'); }
        function closeSettings() { document.getElementById('settings-modal').classList.add('hidden'); }

        function initApp() {
            const savedSize = localStorage.getItem('qr_stock_fontsize') || 'large';
            applyFontSize(savedSize);

            const isDesktop = window.innerWidth > 1024 && !('ontouchstart' in window);
            if (isDesktop) {
                document.getElementById('pc-guide-screen').classList.remove('hidden');
                document.getElementById('scanner-container').classList.add('hidden');
                
                const qrContainer = document.getElementById('qrcode');
                qrContainer.innerHTML = "";
                new QRCode(qrContainer, {
                    text: window.location.href,
                    width: 160,
                    height: 160,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
            } else {
                startCamera({ facingMode: "environment" });
            }
        }

        function startPcCameraMode() {
            document.getElementById('pc-guide-screen').classList.add('hidden');
            document.getElementById('scanner-container').classList.remove('hidden');
            startCamera({ facingMode: "user" });
        }

        function startCamera(cameraConfig) {
            if (html5QrCode) return;
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                cameraConfig,
                { fps: 10, qrbox: { width: 280, height: 280 } },
                onScanSuccess
            ).catch(err => {
                console.error("カメラ起動エラー", err);
            });
        }

        window.addEventListener('load', initApp);

        function onScanSuccess(decodedText, decodedResult) {
            if (isScanned) return;
            isScanned = true;

            let targetUrl = "";
            let warningText = "";

            // HTTPSスキーマ（URL）かどうかを判定
            if (decodedText.startsWith("https://") || decodedText.startsWith("http://")) {
                targetUrl = decodedText;
                warningText = `このURL (${decodedText}) は外部のWebサイトです。安全性を確認の上、表示してください。[cite: 13]`;
            } else {
                // 通常のUUIDなどの場合はGoogle Drive検索URLを生成
                const encodedQuery = encodeURIComponent(decodedText);
                targetUrl = `https://drive.google.com/drive/search?q=${encodedQuery}`;
                warningText = `読み取ったコード "${decodedText}" でGoogle Drive内を検索します。`;
            }

            // モーダルに反映して警告表示[cite: 13]
            document.getElementById('scanned-id-display').innerText = decodedText;
            document.getElementById('warning-message').innerText = warningText;
            document.getElementById('drive-link').href = targetUrl;
            document.getElementById('confirm-modal').classList.remove('hidden');

            if (html5QrCode) {
                html5QrCode.pause();
            }
        }

        function handleDriveOpen() {
            closeConfirmModal();
            resetScanner();
        }

        function closeConfirmModal() {
            document.getElementById('confirm-modal').classList.add('hidden');
            resetScanner();
        }

        function resetScanner() {
            isScanned = false;
            if (html5QrCode) {
                html5QrCode.resume();
            }
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('Service Worker 登録成功'))
                .catch(err => console.log('Service Worker 登録失敗', err));
        }
    </script>
</body>
</html>
