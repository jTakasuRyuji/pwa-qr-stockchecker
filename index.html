<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inventory QR Stockchecker</title>
    <link rel="manifest" href="manifest.json?v=0.2">
    
    <!-- BeerCSS & Material Design 3 (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/beercss@3.7.12/dist/cdn/beer.min.css" rel="stylesheet">
    <script type="module" src="https://cdn.jsdelivr.net/npm/beercss@3.7.12/dist/cdn/beer.min.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/material-dynamic-colors@1.1.2/dist/cdn/material-dynamic-colors.min.js"></script>
    <!-- Google Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">

    <!-- html5-qrcode & QRCode.js -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <style>
        /* カメラビューを全画面に強制配置 */
        #reader { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; background: #000; }
        #reader video { object-fit: cover !important; width: 100% !important; height: 100% !important; }
        #reader__scan_region, #reader__dashboard_section { display: none !important; }
        
        /* UIをカメラの上にオーバーレイ */
        .overlay-ui { position: relative; z-index: 10; }
        .hidden { display: none !important; }

        /* スキャン時のトースト指示用 */
        .scan-toast { position: fixed; bottom: 4rem; left: 50%; transform: translateX(-50%); z-index: 10; white-space: nowrap; }
    </style>
</head>
<body class="dark"> <!-- デフォルトをダークテーマ（カメラアプリでよくある仕様）に設定 -->

    <!-- ========================================== -->
    <!-- PCアクセス時の案内画面 -->
    <!-- ========================================== -->
    <main class="responsive center-align hidden" id="pc-guide-screen">
        <article class="large-padding border">
            <i class="extra">inventory_2</i>
            <h5 class="bold">QR Stockchecker</h5>
            <p>スマートフォン専用のPWAツールです。<br>お手元のスマホカメラで以下のQRコードを読み取ってアクセスしてください。</p>
            
            <div class="space"></div>
            <div id="qrcode" class="center-align" style="background:white; padding:1rem; border-radius:1rem; display:inline-block;"></div>
            <div class="space"></div>

            <button class="border max" onclick="startPcCameraMode()">
                <i>videocam</i>
                <span>PCカメラでテスト起動</span>
            </button>
        </article>
    </main>

    <!-- ========================================== -->
    <!-- Scene 0：スタート・最新版確認画面 -->
    <!-- ========================================== -->
    <main class="responsive center-align" id="start-screen">
        <div class="space extra"></div>
        <i class="extra text-primary" style="font-size: 5rem;">inventory_2</i>
        <div class="space"></div>
        <h3 class="bold">QR Stock</h3>
        <p class="secondary-text">v0.2 - 備品・在庫管理PWA</p>
        <p class="primary-text" id="update-status"></p>

        <div class="space extra"></div>

        <!-- MD3標準の巨大ボタン群 -->
        <nav class="drawer no-space">
            <button class="extra max primary" onclick="startApp()">
                <i>qr_code_scanner</i>
                <span>開始する</span>
            </button>
            <div class="space"></div>
            <button class="large max border" onclick="checkLatestVersion()">
                <i>update</i>
                <span>最新版の確認</span>
            </button>
            <div class="space"></div>
            <button class="large max transparent" onclick="closeApp()">
                <span>アプリを終了する</span>
            </button>
        </nav>
    </main>

    <!-- ========================================== -->
    <!-- Scene 1：スキャン画面 -->
    <!-- ========================================== -->
    <div id="scanner-container" class="hidden">
        <!-- 上部操作ナビゲーション -->
        <nav class="top overlay-ui large-padding">
            <button class="circle transparent large" onclick="returnToStartScreen()">
                <i>close</i>
            </button>
            <div class="max"></div>
            <button class="circle transparent large" onclick="ui('#settings-dialog')">
                <i>settings</i>
            </button>
        </nav>

        <!-- カメラプレビュー -->
        <div id="reader"></div>

        <!-- 下部指示トースト -->
        <div class="overlay-ui scan-toast">
            <article class="round no-elevate" style="background: rgba(0,0,0,0.7); backdrop-filter: blur(10px);">
                <nav>
                    <i class="primary-text" style="animation: pulse 1.5s infinite;">radio_button_checked</i>
                    <span class="bold text-white">QRコードを画面に写してください</span>
                </nav>
            </article>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- Scene 2：ボトムシート (結果確認モーダル) -->
    <!-- ========================================== -->
    <!-- BeerCSSは <dialog class="bottom"> と書くだけで完璧なボトムシートになります -->
    <dialog class="bottom" id="bottom-sheet">
        <nav>
            <i class="extra primary-text" id="modal-icon">inventory_2</i>
            <div class="max">
                <h5 class="bold" id="modal-title">Google Driveで開く</h5>
                <p id="modal-desc">一致するファイルをDrive上で検索します</p>
            </div>
        </nav>

        <div class="space"></div>
        
        <article class="border">
            <label>スキャンデータ</label>
            <div id="modal-scanned-data" class="bold" style="word-break: break-all;"></div>
        </article>

        <div class="space"></div>

        <nav class="right-align">
            <button class="transparent max" onclick="closeBottomSheet()">キャンセル (再撮影)</button>
            <a id="modal-primary-btn" href="#" target="_blank" class="primary max extra" onclick="handleOpenLink()">
                <i>open_in_new</i>
                <span>開く</span>
            </a>
        </nav>
    </dialog>

    <!-- ========================================== -->
    <!-- 設定ダイアログ -->
    <!-- ========================================== -->
    <dialog id="settings-dialog">
        <h5 class="bold">表示設定</h5>
        <p>テキストとUIのサイズを選択します。</p>
        
        <div class="space"></div>

        <nav class="center-align">
            <button class="border max" onclick="changeFontSize('normal')">大 (標準)</button>
            <button class="border max" onclick="changeFontSize('large')">特大</button>
            <button class="border max" onclick="changeFontSize('xlarge')">超特大</button>
        </nav>

        <div class="space"></div>

        <nav class="right-align">
            <button class="primary max" onclick="ui('#settings-dialog')">完了</button>
        </nav>
    </dialog>

    <!-- Script Logic -->
    <script>
        let html5QrCode = null;
        let isScanned = false;

        // BeerCSSのカスタムテーマ（ブランドカラーの青を指定）
        ui('theme', '#0284c7');

        // ==== MD3に基づくフォント・UI全体のスケール一括変更 ====
        // BeerCSSはremベースなので、htmlのフォントサイズを変えるだけで
        // ボタンの高さ、余白、アイコンの大きさなど全てが完璧な比率で連動して大きくなります。
        function applyFontSize(size) {
            localStorage.setItem('qr_stock_fontsize', size);
            const htmlElement = document.documentElement;

            if (size === 'normal') htmlElement.style.fontSize = '18px'; // 標準でもWebより少し大きめ
            if (size === 'large') htmlElement.style.fontSize = '22px';  // 特大
            if (size === 'xlarge') htmlElement.style.fontSize = '26px'; // 超特大
        }

        function changeFontSize(size) { applyFontSize(size); }

        // ==== 画面遷移・カメラ制御 ====
        function startApp() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('scanner-container').classList.remove('hidden');
            startCamera({ facingMode: "environment" });
        }

        function returnToStartScreen() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => { html5QrCode = null; }).catch(err => console.error(err));
            }
            document.getElementById('scanner-container').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        }

        function checkLatestVersion() {
            const status = document.getElementById('update-status');
            status.innerText = "最新バージョンを確認中...";
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistration().then(registration => {
                    if (registration) {
                        registration.update().then(() => {
                            status.innerText = "最新の状態に更新されました！再読み込みします。";
                            setTimeout(() => { window.location.reload(true); }, 800);
                        });
                    } else {
                        window.location.reload(true);
                    }
                }).catch(() => { window.location.reload(true); });
            } else {
                window.location.reload(true);
            }
        }

        function closeApp() {
            if (window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) {
                window.close();
            } else {
                alert("ブラウザのタブまたはアプリを閉じてください。");
            }
        }

        function initApp() {
            const savedSize = localStorage.getItem('qr_stock_fontsize') || 'normal';
            applyFontSize(savedSize);

            const isDesktop = window.innerWidth > 1024 && !('ontouchstart' in window);
            if (isDesktop) {
                document.getElementById('pc-guide-screen').classList.remove('hidden');
                document.getElementById('start-screen').classList.add('hidden');
                
                const qrContainer = document.getElementById('qrcode');
                qrContainer.innerHTML = "";
                new QRCode(qrContainer, {
                    text: window.location.href,
                    width: 160,
                    height: 160,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
            }
        }

        function startPcCameraMode() {
            document.getElementById('pc-guide-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        }

        function startCamera(cameraConfig) {
            if (html5QrCode) return;
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                cameraConfig,
                { fps: 15, qrbox: { width: 400, height: 400 } },
                onScanSuccess
            ).catch(err => { console.error("Camera Error", err); });
        }

        window.addEventListener('load', initApp);

        // ==== QRコード読み取り成功時の処理 ====
        function onScanSuccess(decodedText) {
            if (isScanned) return;
            isScanned = true;

            const icon = document.getElementById('modal-icon');
            const title = document.getElementById('modal-title');
            const desc = document.getElementById('modal-desc');
            const scannedData = document.getElementById('modal-scanned-data');
            const primaryBtn = document.getElementById('modal-primary-btn');

            scannedData.innerText = decodedText;

            if (decodedText.startsWith("https://") || decodedText.startsWith("http://")) {
                icon.innerText = "warning";
                icon.classList.replace('primary-text', 'error-text'); // 警告色に
                title.innerText = "外部Webサイト";
                desc.innerText = "安全性を確認の上アクセスしてください。";
                primaryBtn.href = decodedText;
                primaryBtn.classList.replace('primary', 'error'); // ボタンも警告色に
            } else {
                icon.innerText = "inventory_2";
                icon.classList.replace('error-text', 'primary-text');
                title.innerText = "Google Drive検索";
                desc.innerText = "一致するファイルをDrive上で検索します";
                const encodedQuery = encodeURIComponent(decodedText);
                primaryBtn.href = `https://drive.google.com/drive/search?q=${encodedQuery}`;
                primaryBtn.classList.replace('error', 'primary');
            }

            // BeerCSSの機能でボトムシートを開く
            ui('#bottom-sheet');
            if (html5QrCode) html5QrCode.pause();
        }

        function handleOpenLink() {
            ui('#bottom-sheet'); // ボトムシートを閉じる
            resetScanner();
        }

        function closeBottomSheet() {
            ui('#bottom-sheet'); // ボトムシートを閉じる
            resetScanner();
        }

        function resetScanner() {
            isScanned = false;
            if (html5QrCode) html5QrCode.resume();
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW reg fail', err));
        }
    </script>
</body>
</html>
