<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inventory QR Stockchecker</title>
    <link rel="manifest" href="manifest.json?v=0.2">
    
    <!-- ⚠️ Tailwind CSSは競合の原因となるため完全に削除しました -->

    <!-- BeerCSS & Material Design 3 (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/beercss@3.7.12/dist/cdn/beer.min.css" rel="stylesheet">
    <script type="module" src="https://cdn.jsdelivr.net/npm/beercss@3.7.12/dist/cdn/beer.min.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/material-dynamic-colors@1.1.2/dist/cdn/material-dynamic-colors.min.js"></script>
    <!-- Google Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">

    <!-- html5-qrcode & QRCode.js -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <style>
        /* ==========================================
           スマホで絶対に小さくならないための強制レイアウト
           ========================================== */
        body { margin: 0; height: 100vh; overflow: hidden; background-color: var(--background); }
        
        /* 画面中央への配置 */
        .fullscreen-flex {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 2rem;
            box-sizing: border-box;
        }
        .w-full { width: 100%; max-width: 450px; margin: 0 auto; }
        
        /* 絶対に小さくならない巨大ボタンとテキスト */
        .btn-massive {
            width: 100%;
            min-height: 80px !important;
            font-size: 1.5rem !important;
            border-radius: 24px !important;
            margin-bottom: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            font-weight: bold;
        }

        .icon-massive { font-size: 6rem !important; margin-bottom: 1rem; color: var(--primary); }
        .title-massive { font-size: 3rem !important; font-weight: 900; margin-bottom: 0.5rem; text-align: center; }
        .text-massive { font-size: 1.2rem !important; text-align: center; color: var(--on-surface-variant); font-weight: bold; }

        /* カメラ周り */
        #reader { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; background: #000; }
        #reader video { object-fit: cover !important; width: 100% !important; height: 100% !important; }
        #reader__scan_region, #reader__dashboard_section { display: none !important; }
        
        .overlay-ui { position: fixed; z-index: 10; }
        .top-nav { top: 1.5rem; left: 1.5rem; right: 1.5rem; display: flex; justify-content: space-between; pointer-events: none; }
        .top-nav button { pointer-events: auto; width: 64px; height: 64px; }
        .bottom-toast { bottom: 4rem; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; }
        
        .toast-massive {
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 1.5rem;
            border-radius: 24px;
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body class="dark">

    <!-- ========================================== -->
    <!-- PCアクセス時の案内画面 -->
    <!-- ========================================== -->
    <main id="pc-guide-screen" class="fullscreen-flex hidden">
        <i class="material-symbols-outlined icon-massive">inventory_2</i>
        <div class="title-massive" style="font-size: 2rem !important;">QR Stockchecker</div>
        <div class="text-massive" style="margin-bottom: 2rem;">お手元のスマホでスキャンしてください</div>
        <div id="qrcode" style="background:white; padding:1.5rem; border-radius:1rem;"></div>
        <div style="margin-top: 2rem; width: 100%; max-width: 400px;">
            <button class="btn-massive border" onclick="startPcCameraMode()">PCカメラでテスト起動</button>
        </div>
    </main>

    <!-- ========================================== -->
    <!-- Scene 0：スタート・最新版確認画面 -->
    <!-- ========================================== -->
    <main id="start-screen" class="fullscreen-flex">
        <i class="material-symbols-outlined icon-massive">inventory_2</i>
        <div class="title-massive">QR Stock</div>
        <div class="text-massive">v0.2 - 備品・在庫管理PWA</div>
        <div id="update-status" class="text-massive" style="min-height: 2rem; margin-bottom: 2rem; color: var(--primary);"></div>

        <div class="w-full">
            <button class="btn-massive primary" onclick="startApp()">
                <i class="material-symbols-outlined" style="font-size: 2rem;">qr_code_scanner</i>
                <span>開始する</span>
            </button>
            <button class="btn-massive border" onclick="checkLatestVersion()">
                <i class="material-symbols-outlined" style="font-size: 2rem;">update</i>
                <span>最新版の確認</span>
            </button>
            <button class="btn-massive transparent" onclick="closeApp()">
                <span>アプリを終了する</span>
            </button>
        </div>
    </main>

    <!-- ========================================== -->
    <!-- Scene 1：スキャン画面 -->
    <!-- ========================================== -->
    <div id="scanner-container" class="hidden">
        <div class="overlay-ui top-nav">
            <button class="circle extra transparent" onclick="returnToStartScreen()" style="background: rgba(0,0,0,0.5);">
                <i class="material-symbols-outlined" style="font-size: 2rem; color: white;">close</i>
            </button>
            <button class="circle extra transparent" onclick="ui('#settings-dialog')" style="background: rgba(0,0,0,0.5);">
                <i class="material-symbols-outlined" style="font-size: 2rem; color: white;">settings</i>
            </button>
        </div>

        <div id="reader"></div>

        <div class="overlay-ui bottom-toast">
            <div class="toast-massive">
                QRコードを写してください
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- Scene 2：ボトムシート (結果確認モーダル) -->
    <!-- ========================================== -->
    <dialog class="bottom" id="bottom-sheet" style="border-top-left-radius: 32px; border-top-right-radius: 32px; padding: 2rem;">
        <h5 class="title-massive" id="modal-title" style="text-align: left; font-size: 2rem !important;">Google Driveで開く</h5>
        <p class="text-massive" id="modal-desc" style="text-align: left;">一致するファイルを検索します</p>
        
        <div style="background: var(--surface-variant); padding: 1.5rem; border-radius: 20px; margin: 1.5rem 0;">
            <label style="font-size: 1rem; color: var(--on-surface-variant); font-weight: bold;">スキャンデータ</label>
            <div id="modal-scanned-data" style="font-size: 1.5rem; font-weight: bold; word-break: break-all; margin-top: 0.5rem;"></div>
        </div>

        <button id="modal-primary-btn" class="btn-massive primary" onclick="handleOpenLink()">
            <i class="material-symbols-outlined" style="font-size: 2rem;">open_in_new</i>
            <span>開く</span>
        </button>
        <button class="btn-massive transparent" onclick="closeBottomSheet()">
            キャンセル (再撮影)
        </button>
    </dialog>

    <!-- ========================================== -->
    <!-- 設定ダイアログ -->
    <!-- ========================================== -->
    <dialog id="settings-dialog" style="border-radius: 32px; padding: 2rem;">
        <h5 class="title-massive" style="text-align: center; font-size: 2rem !important; margin-bottom: 2rem;">表示設定</h5>
        
        <button class="btn-massive border" onclick="changeFontSize('normal')" id="btn-size-normal">大 (標準)</button>
        <button class="btn-massive border" onclick="changeFontSize('large')" id="btn-size-large">特大</button>
        <button class="btn-massive border" onclick="changeFontSize('xlarge')" id="btn-size-xlarge">超特大</button>

        <div style="margin-top: 2rem;">
            <button class="btn-massive primary" onclick="ui('#settings-dialog')">完了</button>
        </div>
    </dialog>

    <!-- Script Logic -->
    <script>
        let html5QrCode = null;
        let isScanned = false;

        ui('theme', '#0284c7');

        function applyFontSize(size) {
            localStorage.setItem('qr_stock_fontsize', size);
            const htmlElement = document.documentElement;

            if (size === 'normal') htmlElement.style.fontSize = '16px'; 
            if (size === 'large') htmlElement.style.fontSize = '20px';  
            if (size === 'xlarge') htmlElement.style.fontSize = '24px'; 

            ['normal', 'large', 'xlarge'].forEach(s => {
                const btn = document.getElementById(`btn-size-${s}`);
                if (btn) {
                    if (s === size) {
                        btn.classList.add('primary');
                        btn.classList.remove('border');
                    } else {
                        btn.classList.add('border');
                        btn.classList.remove('primary');
                    }
                }
            });
        }

        function changeFontSize(size) { applyFontSize(size); }

        function startApp() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('scanner-container').classList.remove('hidden');
            startCamera({ facingMode: "environment" });
        }

        function returnToStartScreen() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => { html5QrCode = null; }).catch(err => console.error(err));
            }
            document.getElementById('scanner-container').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        }

        function checkLatestVersion() {
            const status = document.getElementById('update-status');
            status.innerText = "最新バージョンを確認中...";
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistration().then(registration => {
                    if (registration) {
                        registration.update().then(() => {
                            status.innerText = "最新の状態に更新されました！再読み込みします。";
                            setTimeout(() => { window.location.reload(true); }, 800);
                        });
                    } else {
                        window.location.reload(true);
                    }
                }).catch(() => { window.location.reload(true); });
            } else {
                window.location.reload(true);
            }
        }

        function closeApp() {
            if (window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) {
                window.close();
            } else {
                alert("ブラウザのタブまたはアプリを閉じてください。");
            }
        }

        function initApp() {
            const savedSize = localStorage.getItem('qr_stock_fontsize') || 'normal';
            applyFontSize(savedSize);

            const isDesktop = window.innerWidth > 1024 && !('ontouchstart' in window);
            if (isDesktop) {
                document.getElementById('pc-guide-screen').classList.remove('hidden');
                document.getElementById('start-screen').classList.add('hidden');
                
                const qrContainer = document.getElementById('qrcode');
                qrContainer.innerHTML = "";
                new QRCode(qrContainer, {
                    text: window.location.href,
                    width: 200,
                    height: 200,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
            }
        }

        function startPcCameraMode() {
            document.getElementById('pc-guide-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        }

        function startCamera(cameraConfig) {
            if (html5QrCode) return;
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                cameraConfig,
                { fps: 15, qrbox: { width: 400, height: 400 } },
                onScanSuccess
            ).catch(err => { console.error("Camera Error", err); });
        }

        window.addEventListener('load', initApp);

        function onScanSuccess(decodedText) {
            if (isScanned) return;
            isScanned = true;

            const title = document.getElementById('modal-title');
            const desc = document.getElementById('modal-desc');
            const scannedData = document.getElementById('modal-scanned-data');
            const primaryBtn = document.getElementById('modal-primary-btn');

            scannedData.innerText = decodedText;

            if (decodedText.startsWith("https://") || decodedText.startsWith("http://")) {
                title.innerText = "⚠️ 外部Webサイト";
                desc.innerText = "安全性を確認の上アクセスしてください。";
                primaryBtn.querySelector('span').innerText = "サイトを開く";
                primaryBtn.href = decodedText;
                primaryBtn.style.backgroundColor = "var(--error)";
                primaryBtn.style.color = "var(--on-error)";
            } else {
                title.innerText = "Google Drive検索";
                desc.innerText = "一致するファイルを検索します";
                primaryBtn.querySelector('span').innerText = "検索する";
                const encodedQuery = encodeURIComponent(decodedText);
                primaryBtn.href = `https://drive.google.com/drive/search?q=${encodedQuery}`;
                primaryBtn.style.backgroundColor = ""; 
                primaryBtn.style.color = "";
            }

            ui('#bottom-sheet');
            if (html5QrCode) html5QrCode.pause();
        }

        function handleOpenLink() {
            ui('#bottom-sheet');
            resetScanner();
        }

        function closeBottomSheet() {
            ui('#bottom-sheet');
            resetScanner();
        }

        function resetScanner() {
            isScanned = false;
            if (html5QrCode) html5QrCode.resume();
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW reg fail', err));
        }
    </script>
</body>
</html>
